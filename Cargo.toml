cargo-features = ["named-profiles"]

[workspace]
members = [
    "ipc",
    "async-ipc",
    "logging",
    "crypto",
    "tezos/api",
    "tezos/messages",
    "tezos/identity",
    "tezos/encoding",
    "tezos/encoding-derive",
    "tezos/context",
    "tezos/context-api",
    "tezos/context-ipc-client",
    "tezos/protocol-ipc-client",
    "tezos/protocol-ipc-messages",
    "tezos/spsc",
    "tezos/timing",
    "storage",
    "edgekv",
    "edgekv/db-checker",
]

[profile.fuzz]
inherits = "release"
opt-level = 3
debug = 2
debug-assertions = true  # TODO: test and disable if too slow
overflow-checks = true
lto = false
panic = "abort"
incremental = false
codegen-units = 1
