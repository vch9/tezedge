[package]
name = "crypto"
version = "3.1.1"
authors = ["Tomas Sedlak <tomas.sedlak@simplestaking.com>"]
edition = "2021"
rust-version = "1.58"

[dependencies]
anyhow = "1.0"
base58 = "0.1.0"
thiserror = "1.0"
hex = "0.4"
libsecp256k1 = "0.7"
byteorder = "1.4.3"
num-bigint = { version = "0.3", features = ["serde", "rand"] }
num-traits = "0.2.8"
p256 = "0.9"
rand = "0.7.3"
cryptoxide = { version = "0.4.3", default-features = false, features = ["sha2", "blake2"] }
serde = { version = "1.0", features = ["derive"] }
strum = "0.20"
strum_macros = "0.20"
zeroize = { version = "1.5" }
ed25519-compact = { version ="2.0", default-features = false }

fuzzcheck = { git = "https://github.com/tezedge/fuzzcheck-rs.git", optional = true }

[dev-dependencies]
serde_json = "1.0"


[features]
fuzzing = ["fuzzcheck"]
